<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Master India - Chapterwise Study App</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.container{width:100%;max-width:520px;padding:16px}
.card{background:#ffffff;color:#1e293b;border-radius:24px;padding:22px;box-shadow:0 15px 35px #0008}
h1{margin:0 0 5px;font-size:24px;text-align:center;color:#312e81}
.subtitle{color:#64748b;font-size:13px;text-align:center;margin-bottom:18px}

/* Subject Grid */
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
.sub-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:15px;text-align:center;cursor:pointer;transition:0.2s}
.sub-card:active{transform:scale(0.96)}
.sub-card span{font-size:26px;display:block;margin-bottom:6px}
.sub-card h3{margin:0;font-size:15px;color:#1e293b}

/* Chapter List */
.chapter-list{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;margin-bottom:15px}
.chapter-btn{background:#f1f5f9;border:1px solid #cbd5e1;padding:12px 15px;border-radius:12px;text-align:left;font-size:15px;font-weight:bold;color:#1e293b;cursor:pointer;transition:0.2s}
.chapter-btn:hover{background:#e2e8f0}

.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px;text-align:center}
.btn-primary{background:#4f46e5;color:white}
.btn-secondary{background:#64748b;color:white}

.screen{display:none}
.screen.active{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:white}
.coins{background:#facc15;color:#111827;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px}
.progress{height:8px;background:#475569;border-radius:10px;overflow:hidden;margin-bottom:12px}
.progress-bar{height:100%;width:10%;background:#22c55e;transition:.3s}
.info{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:bold;font-size:14px;color:#cbd5e1}
.category-badge{display:inline-block;background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.question{font-size:19px;line-height:1.4;margin:18px 0;color:#1e293b}
.options{display:grid;gap:10px}
.option{padding:14px;border:2px solid #e2e8f0;border-radius:14px;background:#fff;color:#1e293b;font-size:16px;text-align:left;cursor:pointer}
.correct{background:#dcfce7 !important;border-color:#22c55e !important}
.wrong{background:#fee2e2 !important;border-color:#ef4444 !important}
.buttons{display:flex;gap:10px;margin-top:16px}
.hint{flex:1;padding:12px;border:0;border-radius:12px;background:#facc15;color:#111827;font-weight:bold;cursor:pointer}
.next{flex:1;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:bold;cursor:pointer;display:none}
.message{text-align:center;min-height:22px;margin-top:12px;font-weight:bold;font-size:14px}
.footer{text-align:center;color:#94a3b8;margin-top:16px;font-size:13px}

.shake { animation: shake 0.4s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
</style>
</head>
<body>

<div class="container">

  <!-- 1. SUBJECT SCREEN (HOME) -->
  <div class="card screen active" id="homeScreen">
    <h1>📚 Mind Master India</h1>
    <div class="subtitle">Chapterwise Study & Practice App</div>
    
    <div class="subject-grid">
      <div class="sub-card" onclick="openChapters('GK & GS')">
        <span>📖</span>
        <h3>सामान्य ज्ञान</h3>
      </div>
      <div class="sub-card" onclick="openChapters('Mathematics')">
        <span>📐</span>
        <h3>गणित (Maths)</h3>
      </div>
      <div class="sub-card" onclick="openChapters('Reasoning')">
        <span>🧠</span>
        <h3>तर्कशक्ति</h3>
      </div>
      <div class="sub-card" onclick="openChapters('Science')">
        <span>🔬</span>
        <h3>विज्ञान (Science)</h3>
      </div>
      <div class="sub-card" onclick="openChapters('History')">
        <span>🏛️</span>
        <h3>इतिहास</h3>
      </div>
      <div class="sub-card" onclick="openChapters('Geography')">
        <span>🌍</span>
        <h3>भूगोल</h3>
      </div>
    </div>
  </div>

  <!-- 2. CHAPTER SELECTION SCREEN -->
  <div class="card screen" id="chapterScreen">
    <h2 id="subjectTitle" style="margin-top:0;color:#312e81;">Chapters</h2>
    <div class="subtitle">अपनी पसंद का चैप्टर चुनें</div>
    <div class="chapter-list" id="chapterListContainer">
      <!-- Chapters dynamically loaded -->
    </div>
    <button class="btn btn-secondary" onclick="goToHome()">🔙 विषय बदलें</button>
  </div>

  <!-- 3. QUIZ SCREEN -->
  <div class="screen" id="gameScreen">
    <header>
      <div>
        <h2 style="margin:0;font-size:16px;color:white;" id="headerTitle">Quiz</h2>
      </div>
      <div class="coins">🪙 <span id="coins">15</span></div>
    </header>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="info">
      <span>Level <span id="level">1</span> (Unlimited)</span>
      <span>⭐ <span id="score">0</span></span>
      <span>⏱️ <span id="timer">30</span>s</span>
    </div>

    <div class="card" id="quizCard">
      <div class="category-badge" id="category">Chapter</div>
      <div class="question" id="question">Loading...</div>
      <div class="options" id="options"></div>
      <div class="buttons">
        <button class="hint" id="hintBtn" onclick="useHint()">💡 Hint (3 🪙)</button>
        <button class="next" id="nextBtn" onclick="nextQuestion()">Next ➜</button>
      </div>
      <div class="message" id="message"></div>
    </div>
    <button class="btn btn-secondary" onclick="openChapters(currentSubject)" style="margin-top:12px;">🔙 चैप्टर सूची पर जाएं</button>
  </div>

  <div class="footer">Mind Master India • Chapterwise Education</div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.2);
    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'click') {
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }
}

// चैप्टरवाइज प्रश्न बैंक (Chapterwise Question Bank)
const chapterDatabase = {
  "GK & GS": {
    "चैप्टर 1: भारतीय राजव्यवस्था (Polity)": [
      { q: "भारत के संविधान का पिता किसे कहा जाता है?", opts: ["महात्मा गांधी", "डॉ. बी.आर. अम्बेडकर", "जवाहरलाल नेहरू", "राजेंद्र प्रसाद"], ans: 1, hint: "इन्होंने प्रारूप समिति का नेतृत्व किया था।" },
      { q: "मौलिक अधिकार किस देश के संविधान से लिए गए हैं?", opts: ["अमेरिका", "ब्रिटेन", "रूस", "आयरलैंड"], ans: 0, hint: "यह यूएसए (USA) का संविधान है।" }
    ],
    "चैप्टर 2: भारत का सामान्य ज्ञान (Basic GK)": [
      { q: "भारत की राजधानी क्या है?", opts: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], ans: 1, hint: "यह उत्तर भारत का मुख्य प्रशासनिक केंद्र है।" },
      { q: "भारत का राष्ट्रीय खेल कौन सा है?", opts: ["क्रिकेट", "हॉकी", "कबड्डी", "फुटबॉल"], ans: 1, hint: "यह स्टिक और बॉल से खेला जाता है।" }
    ]
  },
  "Mathematics": {
    "चैप्टर 1: प्रतिशतता (Percentage)": [
      { q: "15 का 20% कितना होता है?", opts: ["2", "3", "5", "10"], ans: 1, hint: "15 को 20 से गुणा करके 100 से भाग दें।" },
      { q: "50 का 50% कितना होगा?", opts: ["25", "20", "30", "15"], ans: 0, hint: "50 का आधा निकालें।" }
    ],
    "चैप्टर 2: क्षेत्रमिति (Mensuration)": [
      { q: "यदि एक वर्ग की भुजा 5 सेमी है, तो क्षेत्रफल क्या होगा?", opts: ["10 वर्ग सेमी", "20 वर्ग सेमी", "25 वर्ग सेमी", "15 वर्ग सेमी"], ans: 2, hint: "क्षेत्रफल = भुजा × भुजा" },
      { q: "आयत का क्षेत्रफल का सूत्र क्या है?", opts: ["लंबाई × चौड़ाई", "2 × (लंबाई + चौड़ाई)", "भुजा का वर्ग", "इनमें से कोई नहीं"], ans: 0, hint: "Length multiplied by Breadth." }
    ]
  },
  "Reasoning": {
    "चैप्टर 1: कोडिंग-डिकोडिंग (Coding)": [
      { q: "ACE के बाद अगला क्रम क्या होगा?", opts: ["GIK", "MOQ", "BDF", "HJK"], ans: 0, hint: "एक-एक अक्षर छोड़कर आगे बढ़ें।" },
      { q: "यदि CAT = 24 हो, तो DOG = ?", opts: ["26", "28", "30", "32"], ans: 0, hint: "अक्षरों की नंबर वैल्यू जोड़ें (D=4, O=15, G=7)।" }
    ]
  },
  "Science": {
    "चैप्टर 1: मानव शरीर (Human Body)": [
      { q: "मानव शरीर की सबसे बड़ी हड्डी कौन सी है?", opts: ["फीमर (जांघ की)", "रेडियस", "टीबिया", "स्कल"], ans: 0, hint: "यह पैर की हड्डी होती है।" },
      { q: "मनुष्य के शरीर में कुल कितनी हड्डियां होती हैं?", opts: ["206", "208", "210", "198"], ans: 0, hint: "यह एक वयस्क मानव में होती हैं।" }
    ]
  },
  "History": {
    "चैप्टर 1: आधुनिक भारत (Modern History)": [
      { q: "पानीपत का प्रथम युद्ध कब हुआ था?", opts: ["1526", "1556", "1761", "1192"], ans: 0, hint: "यह बाबर और इब्राहिम लोदी के बीच हुआ था।" },
      { q: "महात्मा गांधी का जन्म कब हुआ था?", opts: ["2 अक्टूबर 1869", "15 अगस्त 1947", "26 जनवरी 1950", "14 नवंबर 1889"], ans: 0, hint: "इस दिन गांधी जयंती मनाई जाती है।" }
    ]
  },
  "Geography": {
    "चैप्टर 1: भारतीय भूगोल (Indian Geography)": [
      { q: "भारत का सबसे बड़ा राज्य क्षेत्रफल की दृष्टि से कौन सा है?", opts: ["उत्तर प्रदेश", "महाराष्ट्र", "राजस्थान", "मध्य प्रदेश"], ans: 2, hint: "यह रेगिस्तानी क्षेत्र के लिए प्रसिद्ध है।" },
      { q: "विश्व की सबसे लंबी नदी कौन सी है?", opts: ["अमेज़न नदी", "नील नदी", "गंगा नदी", "यांग्त्ज़ी नदी"], ans: 1, hint: "यह अफ्रीका महाद्वीप में है।" }
    ]
  }
};

let currentSubject = "";
let currentChapter = "";
let currentLevel = 1;
let score = 0;
let coins = 15;
let time = 30;
let timer = null;
let answered = false;
let currentQuestion = {};

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goToHome() {
  playSound('click');
  clearInterval(timer);
  switchScreen('homeScreen');
}

function openChapters(subject) {
  playSound('click');
  currentSubject = subject;
  document.getElementById("subjectTitle").textContent = subject + " Chapters";
  
  const container = document.getElementById("chapterListContainer");
  container.innerHTML = "";

  const chapters = chapterDatabase[subject] || {};
  Object.keys(chapters).forEach(chap => {
    const btn = document.createElement("button");
    btn.className = "chapter-btn";
    btn.textContent = "📁 " + chap;
    btn.onclick = () => startChapterQuiz(chap);
    container.appendChild(btn);
  });

  switchScreen('chapterScreen');
}

function startChapterQuiz(chapter) {
  playSound('click');
  currentChapter = chapter;
  currentLevel = 1;
  score = 0;
  coins = 15;
  document.getElementById("headerTitle").textContent = chapter;
  switchScreen('gameScreen');
  loadQuestion();
}

function loadQuestion() {
  clearInterval(timer);
  answered = false;
  time = 30;

  document.getElementById("level").textContent = currentLevel;
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("timer").textContent = time;

  const pool = chapterDatabase[currentSubject][currentChapter] || [];

  // अगर चैप्टर के सवाल खत्म हों, तो अनलिमिटेड ऑटोमैटिक जनरेट करें
  if (currentLevel <= pool.length) {
    currentQuestion = pool[currentLevel - 1];
  } else {
    let num1 = Math.floor(Math.random() * 40) + 5;
    let num2 = Math.floor(Math.random() * 20) + 2;
    let res = num1 + num2;
    let opts = [res.toString(), (res + 4).toString(), (res - 3).toString(), (res + 7).toString()];
    opts.sort(() => Math.random() - 0.5);

    currentQuestion = {
      q: `${currentChapter} (अभ्यास ${currentLevel}): हल करें ${num1} + ${num2} = ?`,
      opts: opts,
      ans: opts.indexOf(res.toString()),
      hint: "इस चैप्टर के मूल नियमों के अनुसार गणना करें।"
    };
  }

  document.getElementById("category").textContent = currentChapter;
  document.getElementById("question").textContent = currentQuestion.q;

  document.getElementById("message").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("hintBtn").disabled = false;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";
  
  currentQuestion.opts.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = option;
    btn.onclick = () => {
      playSound('click');
      checkAnswer(index, btn);
    };
    optionsContainer.appendChild(btn);
  });

  document.getElementById("progressBar").style.width = ((currentLevel % 10) * 10 || 100) + "%";

  timer = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = time;
    if (time <= 0) {
      clearInterval(timer);
      if (!answered) {
        answered = true;
        playSound('wrong');
        document.getElementById("message").textContent = "⏰ समय समाप्त!";
        document.getElementById("message").style.color = "red";
        showCorrect();
        document.getElementById("nextBtn").style.display = "block";
      }
    }
  }, 1000);
}

function checkAnswer(index, button) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const correct = currentQuestion.ans;
  document.querySelectorAll(".option").forEach(b => b.disabled = true);

  if (index === correct) {
    playSound('correct');
    button.classList.add("correct");
    let points = 10 + time;
    score += points;
    coins += 3;
    document.getElementById("message").textContent = `🎉 सही जवाब! +${points} ⭐ +3 🪙`;
    document.getElementById("message").style.color = "green";
  } else {
    playSound('wrong');
    button.classList.add("wrong");
    const card = document.getElementById("quizCard");
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 400);

    document.getElementById("message").textContent = "❌ गलत जवाब!";
    document.getElementById("message").style.color = "red";
    showCorrect();
  }

  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("nextBtn").style.display = "block";
}

function showCorrect() {
  const correct = currentQuestion.ans;
  const buttons = document.querySelectorAll(".option");
  if (buttons[correct]) {
    buttons[correct].classList.add("correct");
  }
}

function nextQuestion() {
  playSound('click');
  currentLevel++;
  loadQuestion();
}

function useHint() {
  playSound('click');
  if (answered) return;
  if (coins < 3) {
    document.getElementById("message").textContent = "🪙 Hint के लिए कम से कम 3 coins चाहिए।";
    document.getElementById("message").style.color = "#d97706";
    return;
  }
  coins -= 3;
  document.getElementById("coins").textContent = coins;
  document.getElementById("message").textContent = "💡 " + currentQuestion.hint;
  document.getElementById("message").style.color = "#d97706";
  document.getElementById("hintBtn").disabled = true;
}
</script>
</body>
</html>
