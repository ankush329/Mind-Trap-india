
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Master India</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.container{width:100%;max-width:520px;padding:18px}
.card{background:white;color:#172033;border-radius:24px;padding:24px;box-shadow:0 15px 35px #0006}
h1{margin:0 0 5px;font-size:28px;text-align:center;color:#312e81}
.subtitle{color:#64748b;font-size:14px;text-align:center;margin-bottom:20px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;margin-bottom:12px;text-align:center}
.btn-primary{background:#4f46e5;color:white}
.btn-secondary{background:#facc15;color:#111827}
.screen{display:none}
.screen.active{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:white}
.coins{background:#facc15;color:#111827;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px}
.progress{height:8px;background:#475569;border-radius:10px;overflow:hidden;margin-bottom:12px}
.progress-bar{height:100%;width:1%;background:#22c55e;transition:.3s}
.info{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:bold;font-size:14px;color:#cbd5e1}
.category{display:inline-block;background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.question{font-size:20px;line-height:1.4;margin:18px 0}
.options{display:grid;gap:10px}
.option{padding:14px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;font-size:16px;text-align:left;cursor:pointer}
.correct{background:#dcfce7 !important;border-color:#22c55e !important}
.wrong{background:#fee2e2 !important;border-color:#ef4444 !important}
.buttons{display:flex;gap:10px;margin-top:16px}
.hint{flex:1;padding:12px;border:0;border-radius:12px;background:#facc15;font-weight:bold;cursor:pointer}
.next{flex:1;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:bold;cursor:pointer;display:none}
.message{text-align:center;min-height:22px;margin-top:12px;font-weight:bold;font-size:14px}
.footer{text-align:center;color:#cbd5e1;margin-top:16px;font-size:13px}
</style>
</head>
<body>

<div class="container">

  <!-- 1. HOME SCREEN -->
  <div class="card screen active" id="homeScreen">
    <h1>🧠 Mind Master India</h1>
    <div class="subtitle">100 Brain Puzzles & Logic Challenge</div>
    <button class="btn btn-primary" onclick="startGame()">▶ खेल शुरू करें (Start)</button>
    <button class="btn btn-secondary" onclick="startDaily()">🔥 डेली चैलेंज</button>
  </div>

  <!-- 2. GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <header>
      <div>
        <h2 style="margin:0;font-size:20px;color:white;">Mind Master India</h2>
      </div>
      <div class="coins">🪙 <span id="coins">15</span></div>
    </header>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="info">
      <span>Level <span id="level">1</span>/100</span>
      <span>⭐ <span id="score">0</span></span>
      <span>⏱️ <span id="timer">30</span>s</span>
    </div>

    <div class="card">
      <div class="category" id="category">Number Puzzle</div>
      <div class="question" id="question">Loading...</div>
      <div class="options" id="options"></div>
      <div class="buttons">
        <button class="hint" id="hintBtn" onclick="useHint()">💡 Hint (3 🪙)</button>
        <button class="next" id="nextBtn" onclick="nextQuestion()">Next ➜</button>
      </div>
      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- 3. GAME OVER SCREEN -->
  <div class="card screen" id="gameOverScreen" style="text-align:center;">
    <h2>🏆 शानदार सफर!</h2>
    <p>आपने सभी लेवल्स पूरे कर लिए हैं।</p>
    <h3>⭐ कुल स्कोर: <span id="finalScore">0</span></h3>
    <h3>🪙 कुल सिक्के: <span id="finalCoins">0</span></h3>
    <button class="btn btn-primary" onclick="goToHome()" style="margin-top:15px;">🏠 होम पेज पर जाएं</button>
  </div>

  <div class="footer">Mind Master India • 100 Levels Edition</div>
</div>

<script>
const questions = [];
const categories = ["🔢 Number Puzzle", "🧠 Logic Puzzle", "👀 Observation", "🤔 Riddle", "🇮🇳 India General Knowledge"];
const hintsList = [
  "सवाल को एक बार फिर ध्यान से पढ़ें।", 
  "इसमें थोड़ा गणितीय या तार्किक नियम छिपा है।", 
  "जल्दबाजी न करें, पहली सोच अक्सर ट्रैप होती है।", 
  "विकल्पों को ध्यान से जांचें।"
];

for (let i = 1; i <= 100; i++) {
  let cat = categories[(i - 1) % categories.length];
  let qText = `लेवल ${i}: यदि एक क्रम आगे बढ़ रहा है, तो अगला सही कदम क्या होगा?`;
  let opts = [i * 2, i * 3, i + 10, i * 4];
  let ans = 0;
  
  if(i === 1) { qText = "2, 4, 8, 16, ?"; opts = ["20", "24", "32", "36"]; ans = 2; }
  else if(i === 2) { qText = "3, 6, 11, 18, 27, ?"; opts = ["36", "38", "40", "42"]; ans = 1; }
  else if(i === 5) { qText = "कौन सा महीना 28 दिनों का होता है?"; opts = ["फरवरी", "जनवरी", "सारे 12 महीने", "कोई नहीं"]; ans = 2; }
  else if(i === 10) { qText = "10 + 10 ÷ 2 = ?"; opts = ["10", "15", "20", "25"]; ans = 1; }
  else if(i === 25) { qText = "1, 4, 9, 16, ?"; opts = ["20", "24", "25", "30"]; ans = 2; }
  else if(i === 50) { qText = "भारत की राजधानी क्या है?"; opts = ["मुंबई", "नई दिल्ली", "पुणे", "नागपुर"]; ans = 1; }
  else if(i === 75) { qText = "7 × 8 = ?"; opts = ["54", "56", "58", "64"]; ans = 1; }
  else if(i === 100) { qText = "⚡ अंतिम Mind Trap: 3, 6, 11, 18, ?"; opts = ["25", "26", "27", "28"]; ans = 2; }
  else {
    let correctVal = (i * 2);
    ans = Math.floor(Math.random() * 4);
    opts = [i + 5, i * 2, (i * 3) - 1, i + 12];
    opts[ans] = correctVal;
  }

  questions.push({
    q: qText,
    options: opts.map(String),
    answer: ans,
    cat: cat,
    hint: hintsList[i % hintsList.length]
  });
}

let current = 0;
let score = 0;
let coins = 15;
let time = 30;
let timer = null;
let answered = false;

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startGame() {
  current = 0;
  score = 0;
  coins = 15;
  switchScreen('gameScreen');
  loadQuestion();
}

function startDaily() {
  current = Math.floor(Math.random() * 90);
  score = 0;
  switchScreen('gameScreen');
  loadQuestion();
  alert("🔥 डेली चैलेंज शुरू! आपके लिए एक स्पेशल रैंडम लेवल चुना गया है।");
}

function goToHome() {
  clearInterval(timer);
  switchScreen('homeScreen');
}

function loadQuestion() {
  clearInterval(timer);
  answered = false;
  time = 30;

  document.getElementById("level").textContent = current + 1;
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("timer").textContent = time;

  const q = questions[current];
  document.getElementById("category").textContent = q.cat;
  document.getElementById("question").textContent = q.q;

  document.getElementById("message").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("hintBtn").disabled = false;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";
  
  q.options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = option;
    btn.onclick = () => checkAnswer(index, btn);
    optionsContainer.appendChild(btn);
  });

  document.getElementById("progressBar").style.width = ((current + 1) / questions.length * 100) + "%";

  timer = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = time;
    if (time <= 0) {
      clearInterval(timer);
      if (!answered) {
        answered = true;
        document.getElementById("message").textContent = "⏰ समय समाप्त!";
        document.getElementById("message").style.color = "red";
        showCorrect();
        document.getElementById("nextBtn").style.display = "block";
      }
    }
  }, 1000);
}

function checkAnswer(index, button) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const correct = questions[current].answer;
  document.querySelectorAll(".option").forEach(b => b.disabled = true);

  if (index === correct) {
    button.classList.add("correct");
    let points = 10 + time;
    score += points;
    coins += 3;
    document.getElementById("message").textContent = `🎉 सही जवाब! +${points} ⭐ +3 🪙`;
    document.getElementById("message").style.color = "green";
  } else {
    button.classList.add("wrong");
    document.getElementById("message").textContent = "❌ गलत जवाब!";
    document.getElementById("message").style.color = "red";
    showCorrect();
  }

  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("nextBtn").style.display = "block";
}

function showCorrect() {
  const correct = questions[current].answer;
  const buttons = document.querySelectorAll(".option");
  if (buttons[correct]) {
    buttons[correct].classList.add("correct");
  }
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    switchScreen('gameOverScreen');
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalCoins").textContent = coins;
  } else {
    loadQuestion();
  }
}

function useHint() {
  if (answered) return;
  if (coins < 3) {
    document.getElementById("message").textContent = "🪙 Hint के लिए कम से कम 3 coins चाहिए।";
    document.getElementById("message").style.color = "#d97706";
    return;
  }
  coins -= 3;
  document.getElementById("coins").textContent = coins;
  document.getElementById("message").textContent = "💡 " + questions[current].hint;
  document.getElementById("message").style.color = "#d97706";
  document.getElementById("hintBtn").disabled = true;
}
</script>
</body>
</html>
