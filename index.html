<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Master India - Study & Unlimited Puzzles</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.container{width:100%;max-width:520px;padding:18px}
.card{background:white;color:#172033;border-radius:24px;padding:24px;box-shadow:0 15px 35px #0006;transition:transform 0.2s}
h1{margin:0 0 5px;font-size:26px;text-align:center;color:#312e81}
.subtitle{color:#64748b;font-size:13px;text-align:center;margin-bottom:20px}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:bold;cursor:pointer;margin-bottom:12px;text-align:center;transition:transform 0.1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#4f46e5;color:white}
.btn-secondary{background:#facc15;color:#111827}
.screen{display:none}
.screen.active{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:white}
.coins{background:#facc15;color:#111827;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:14px}
.progress{height:8px;background:#475569;border-radius:10px;overflow:hidden;margin-bottom:12px}
.progress-bar{height:100%;width:10%;background:#22c55e;transition:.3s}
.info{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:bold;font-size:14px;color:#cbd5e1}
.category{display:inline-block;background:#e0e7ff;color:#3730a3;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.question{font-size:19px;line-height:1.4;margin:18px 0}
.options{display:grid;gap:10px}
.option{padding:14px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;font-size:16px;text-align:left;cursor:pointer;transition:transform 0.1s}
.option:active{transform:scale(0.98)}
.correct{background:#dcfce7 !important;border-color:#22c55e !important}
.wrong{background:#fee2e2 !important;border-color:#ef4444 !important}
.buttons{display:flex;gap:10px;margin-top:16px}
.hint{flex:1;padding:12px;border:0;border-radius:12px;background:#facc15;font-weight:bold;cursor:pointer}
.next{flex:1;padding:12px;border:0;border-radius:12px;background:#4f46e5;color:white;font-weight:bold;cursor:pointer;display:none}
.message{text-align:center;min-height:22px;margin-top:12px;font-weight:bold;font-size:14px}
.footer{text-align:center;color:#cbd5e1;margin-top:16px;font-size:13px}

.shake { animation: shake 0.4s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
</style>
</head>
<body>

<div class="container" id="mainContainer">

  <!-- 1. HOME SCREEN -->
  <div class="card screen active" id="homeScreen">
    <h1>🧠 Mind Master India</h1>
    <div class="subtitle">Study, GK & Unlimited Brain Puzzles</div>
    <button class="btn btn-primary" onclick="startGame()">▶ खेल शुरू करें (Unlimited Play)</button>
    <button class="btn btn-secondary" onclick="startDaily()">🔥 डेली चैलेंज</button>
  </div>

  <!-- 2. GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <header>
      <div>
        <h2 style="margin:0;font-size:18px;color:white;">Mind Master India</h2>
      </div>
      <div class="coins">🪙 <span id="coins">15</span></div>
    </header>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="info">
      <span>Level <span id="level">1</span> (Unlimited)</span>
      <span>⭐ <span id="score">0</span></span>
      <span>⏱️ <span id="timer">30</span>s</span>
    </div>

    <div class="card" id="quizCard">
      <div class="category" id="category">📚 General Knowledge</div>
      <div class="question" id="question">Loading...</div>
      <div class="options" id="options"></div>
      <div class="buttons">
        <button class="hint" id="hintBtn" onclick="useHint()">💡 Hint (3 🪙)</button>
        <button class="next" id="nextBtn" onclick="nextQuestion()">Next ➜</button>
      </div>
      <div class="message" id="message"></div>
    </div>
  </div>

  <!-- 3. GAME OVER SCREEN (अगर कभी लाइफ खत्म हों) -->
  <div class="card screen" id="gameOverScreen" style="text-align:center;">
    <h2>🏆 शानदार प्रदर्शन!</h2>
    <p>आपने बेहतरीन अभ्यास किया है।</p>
    <h3>⭐ कुल स्कोर: <span id="finalScore">0</span></h3>
    <h3>🪙 कुल सिक्के: <span id="finalCoins">0</span></h3>
    <button class="btn btn-primary" onclick="goToHome()" style="margin-top:15px;">🏠 होम पेज पर जाएं</button>
  </div>

  <div class="footer">Mind Master India • Study Edition</div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.2);
    gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'click') {
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }
}

// स्टडी और लॉजिक आधारित स्टडी बैंक
const studyBank = [
  { cat: "📚 सामान्य ज्ञान (GK)", q: "भारत की राजधानी क्या है?", opts: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], ans: 1, hint: "यह उत्तर भारत का मुख्य प्रशासनिक केंद्र है।" },
  { cat: "📚 सामान्य ज्ञान (GK)", q: "भारत के प्रथम राष्ट्रपति कौन थे?", opts: ["डॉ. राजेन्द्र प्रसाद", "पं. जवाहरलाल नेहरू", "महात्मा गांधी", "सरदार पटेल"], ans: 0, hint: "इनका संबंध बिहार से था।" },
  { cat: "📐 गणित (Maths)", q: "15 का 20% कितना होता है?", opts: ["2", "3", "5", "10"], ans: 1, hint: "15 को 20 से गुणा करके 100 से भाग दें।" },
  { cat: "📐 गणित (Maths)", q: "अगर एक वर्ग की भुजा 5 सेमी है, तो उसका क्षेत्रफल क्या होगा?", opts: ["10 वर्ग सेमी", "20 वर्ग सेमी", "25 वर्ग सेमी", "15 वर्ग सेमी"], ans: 2, hint: "क्षेत्रफल = भुजा × भुजा" },
  { cat: "🧠 रीजनिंग (Reasoning)", q: "ACE, GGI के बाद अगला क्रम क्या होगा? (मान लीजिए पैटर्न अनुसार)", opts: ["IKM", "MOQ", "ACE", "BDF"], ans: 0, hint: "वर्णमाला (Alphabet) में अक्षरों का गैپ देखें।" },
  { cat: "🔬 विज्ञान (Science)", q: "मानव शरीर की सबसे बड़ी हड्डी कौन सी है?", opts: ["फीमर (जांघ की)", "रेडियस", "टीबिया", "स्कल"], ans: 0, hint: "यह पैर की हड्डी होती है।" },
  { cat: "🔬 विज्ञान (Science)", q: "प्रकाश वर्ष (Light Year) किसकी इकाई है?", opts: ["समय", "दूरी", "प्रकाश की तीव्रता", "गति"], ans: 1, hint: "यह अंतरिक्ष में लंबी दूरियां मापने के काम आती है।" }
];

let currentLevel = 1;
let score = 0;
let coins = 15;
let time = 30;
let timer = null;
let answered = false;
let currentQuestion = {};

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startGame() {
  playSound('click');
  currentLevel = 1;
  score = 0;
  coins = 15;
  switchScreen('gameScreen');
  generateQuestion();
}

function startDaily() {
  playSound('click');
  currentLevel = Math.floor(Math.random * 50) + 1;
  score = 0;
  switchScreen('gameScreen');
  generateQuestion();
  alert("🔥 डेली चैलेंज: आपके लिए एक स्पेशल स्टडी प्रश्न लोड किया गया है!");
}

function goToHome() {
  playSound('click');
  clearInterval(timer);
  switchScreen('homeScreen');
}

// अनलिमिटेड और डायनामिक सवाल जनरेटर (स्टडी + पज़ल्स)
function generateQuestion() {
  clearInterval(timer);
  answered = false;
  time = 30;

  document.getElementById("level").textContent = currentLevel;
  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("timer").textContent = time;

  // अगर शुरुआती लेवल्स हैं तो फिक्स स्टडी बैंक से दें, वरना अनलिमिटेड आटोमैटिक बनाएं
  if (currentLevel <= studyBank.length) {
    currentQuestion = studyBank[currentLevel - 1];
  } else {
    // अनलिमिटेड लेवल्स के लिए ऑटोमैटिक मैथ/लॉजिक सवाल जनरेट करना
    let num1 = Math.floor(Math.random() * 20) + 2;
    let num2 = Math.floor(Math.random() * 15) + 2;
    let ops = ['+', '-', '×'];
    let chosenOp = ops[Math.floor(Math.random() * ops.length)];
    let res = 0;
    if(chosenOp === '+') res = num1 + num2;
    if(chosenOp === '-') res = num1 - num2;
    if(chosenOp === '×') res = num1 * num2;

    let wrong1 = res + 2;
    let wrong2 = res - 3;
    let wrong3 = res + 5;
    let opts = [res.toString(), wrong1.toString(), wrong2.toString(), wrong3.toString()];
    // शफल करें
    opts.sort(() => Math.random() - 0.5);
    let correctIdx = opts.indexOf(res.toString());

    currentQuestion = {
      cat: "📐 गणित और एप्टीट्यूड (Unlimited)",
      q: `लेवल ${currentLevel} अभ्यास: सरल करें ${num1} ${chosenOp} ${num2} = ?`,
      opts: opts,
      ans: correctIdx,
      hint: "बुनियादी गणितीय गणना (Basic Calculation) का उपयोग करें।"
    };
  }

  document.getElementById("category").textContent = currentQuestion.cat;
  document.getElementById("question").textContent = currentQuestion.q;

  document.getElementById("message").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("hintBtn").disabled = false;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";
  
  currentQuestion.opts.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = option;
    btn.onclick = () => {
      playSound('click');
      checkAnswer(index, btn);
    };
    optionsContainer.appendChild(btn);
  });

  // प्रोग्रेस बार को अनलिमिटेड लूप में सेट करना
  let progPercent = (currentLevel % 10) * 10;
  if(progPercent === 0) progPercent = 100;
  document.getElementById("progressBar").style.width = progPercent + "%";

  timer = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = time;
    if (time <= 0) {
      clearInterval(timer);
      if (!answered) {
        answered = true;
        playSound('wrong');
        document.getElementById("message").textContent = "⏰ समय समाप्त!";
        document.getElementById("message").style.color = "red";
        showCorrect();
        document.getElementById("nextBtn").style.display = "block";
      }
    }
  }, 1000);
}

function checkAnswer(index, button) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const correct = currentQuestion.ans;
  document.querySelectorAll(".option").forEach(b => b.disabled = true);

  if (index === correct) {
    playSound('correct');
    button.classList.add("correct");
    let points = 10 + time;
    score += points;
    coins += 3;
    document.getElementById("message").textContent = `🎉 सही जवाब! +${points} ⭐ +3 🪙`;
    document.getElementById("message").style.color = "green";
  } else {
    playSound('wrong');
    button.classList.add("wrong");
    const card = document.getElementById("quizCard");
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 400);

    document.getElementById("message").textContent = "❌ गलत जवाब!";
    document.getElementById("message").style.color = "red";
    showCorrect();
  }

  document.getElementById("score").textContent = score;
  document.getElementById("coins").textContent = coins;
  document.getElementById("nextBtn").style.display = "block";
}

function showCorrect() {
  const correct = currentQuestion.ans;
  const buttons = document.querySelectorAll(".option");
  if (buttons[correct]) {
    buttons[correct].classList.add("correct");
  }
}

function nextQuestion() {
  playSound('click');
  currentLevel++; // लेवल आगे बढ़ेगा, कभी खत्म नहीं होगा (Unlimited!)
  generateQuestion();
}

function useHint() {
  playSound('click');
  if (answered) return;
  if (coins < 3) {
    document.getElementById("message").textContent = "🪙 Hint के लिए कम से कम 3 coins चाहिए।";
    document.getElementById("message").style.color = "#d97706";
    return;
  }
  coins -= 3;
  document.getElementById("coins").textContent = coins;
  document.getElementById("message").textContent = "💡 " + currentQuestion.hint;
  document.getElementById("message").style.color = "#d97706";
  document.getElementById("hintBtn").disabled = true;
}
</script>
</body>
</html>
